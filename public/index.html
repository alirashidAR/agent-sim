<!DOCTYPE html>
<html>
<head>
  <title>Cozy LLM Agent Rooms</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #cbe6f7; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    #phaser-container { width: 100vw; height: 100vh; margin: 0; display: block;}
  </style>
</head>
<body>
  <div id="phaser-container"></div>
<script>
// -- Agent and prop placeholders --
// Put your file PNGs here if you have them:
const AGENT_PNGS = {
  "A": "assets/alice.png",
  "B": "assets/bob.png",
  "C": "assets/personC.png",
  "D": "assets/personD.png"
};
// Fallback icons by task (change as you get real tasks/PNGs)
const TASK_ICONS = {
  baker: "🥖",  artist: "🎨",  farmer: "🥕",  scientist: "🔬",  "?": "❓"
};
const ROOM_COLORS = [ "#e6fbe1", "#fdf9e1", "#ffe1f4", "#e7f3fc" ];
const AGENT_NAMES = [ "Alice", "Bob", "Carol", "Dave" ];

let gameState = {
  agents: {
    A: { id:"A", name:"Alice", x:0, y:0, lastMessage:"Hi Bob!", task:"baker" },
    B: { id:"B", name:"Bob",   x:0, y:0, lastMessage:"Hello Alice!", task:"artist" }
    // Add more as needed
  }
};
let agentSprites = {};
let width = window.innerWidth, height = window.innerHeight, scene, scale = 1.0;

const config = {
  type: Phaser.AUTO,
  scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
  parent: 'phaser-container',
  transparent: false,
  backgroundColor: "#cbe6f7",
  scene: { preload, create, update }
};

// Map agent keys to corners for up to 4 agents (top-left, top-right, bottom-left, bottom-right)
const AGENT_LAYOUT = [
  { anchor: "topleft",   dx:-1, dy:-1 },
  { anchor: "topright",  dx:1,  dy:-1 },
  { anchor: "botleft",   dx:-1, dy:1 },
  { anchor: "botright",  dx:1,  dy:1 }
];

// Main responsive sizes
function calcLayout() {
  width = window.innerWidth;
  height = window.innerHeight;
  // Common room is square, take as much space as fits
  let commonW = Math.floor(Math.min(width, height) * 0.39);
  let roomW = Math.floor(commonW * 0.78);
  let margin = Math.floor(commonW * 0.1);
  let cx = width/2, cy = height/2;
  // Corners
  return {
    commonRoom: { x:cx, y:cy, w:commonW, h:commonW },
    agentRooms: [
      { x:cx-(commonW/2)-(roomW/2)+margin, y:cy-(commonW/2)-(roomW/2)+margin, w:roomW, h:roomW }, // TL
      { x:cx+(commonW/2)+(roomW/2)-margin, y:cy-(commonW/2)-(roomW/2)+margin, w:roomW, h:roomW }, // TR
      { x:cx-(commonW/2)-(roomW/2)+margin, y:cy+(commonW/2)+(roomW/2)-margin, w:roomW, h:roomW }, // BL
      { x:cx+(commonW/2)+(roomW/2)-margin, y:cy+(commonW/2)+(roomW/2)-margin, w:roomW, h:roomW }  // BR
    ]
  };
}

// Simple SVG/canvas icon if no task PNG available
function drawTaskIcon(ctx, icon, x, y) {
  ctx.font = "32px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.strokeStyle="#fff"; ctx.lineWidth=6;
  ctx.strokeText(icon, x, y);
  ctx.fillStyle="#444";
  ctx.fillText(icon, x, y);
}

function preload() {
  scene = this;
  for (let key in AGENT_PNGS) scene.load.image(key, AGENT_PNGS[key]);
}

function create() {
  this.graphics = this.add.graphics();
  window.addEventListener('resize', ()=>scene.scene.restart());
}

function update() {
  // --- LAYOUT ---
  const layout = calcLayout();

  // --- REDRAW ALL ---
  scene.graphics.clear();

  // --- Common room (middle square) ---
  scene.graphics.lineStyle(5,0xb3adab,1);
  scene.graphics.fillStyle(0xf7f5f3,0.96);
  scene.graphics.strokeRoundedRect(
    layout.commonRoom.x-layout.commonRoom.w/2, layout.commonRoom.y-layout.commonRoom.h/2,
    layout.commonRoom.w, layout.commonRoom.h, 34
  );
  scene.graphics.fillRoundedRect(
    layout.commonRoom.x-layout.commonRoom.w/2, layout.commonRoom.y-layout.commonRoom.h/2,
    layout.commonRoom.w, layout.commonRoom.h, 34
  );
  // Label
  scene.add.text(layout.commonRoom.x, layout.commonRoom.y-layout.commonRoom.h/2+32, "Common Room",
    {fontFamily:"monospace",fontSize:'2.1vw',fill:"#5942ae"}).setOrigin(0.5,0).setDepth(3);

  // --- AGENT ROOMS ---
  let i=0;
  for (let id in gameState.agents) {
    let ag = gameState.agents[id];
    let room = layout.agentRooms[i];
    let color = Phaser.Display.Color.HexStringToColor(ROOM_COLORS[i%ROOM_COLORS.length]).color;
    scene.graphics.lineStyle(5,0xb3adab,1);
    scene.graphics.fillStyle(color,0.85);
    // Room rect (rounded, with slight shadow)
    scene.graphics.fillRoundedRect(
      room.x-room.w/2, room.y-room.h/2, room.w, room.h, 36
    );
    scene.graphics.strokeRoundedRect(
      room.x-room.w/2, room.y-room.h/2, room.w, room.h, 36
    );
    // Label
    scene.add.text(room.x, room.y-room.h/2+26,
      `${ag.name}'s Room`, {fontFamily:"monospace",fontSize:'1.9vw', fill:"#45b166",align:"center"}).setOrigin(0.5,0);

    // "Door" open to common room:
    let doorW = Math.max(30, room.w*0.18);
    let doorH = layout.commonRoom.w*0.28;
    // At shared corner between agent room and common room
    let doorX = layout.commonRoom.x + (room.x-layout.commonRoom.x)/Math.abs(room.x-layout.commonRoom.x || 1) * layout.commonRoom.w/2;
    let doorY = layout.commonRoom.y + (room.y-layout.commonRoom.y)/Math.abs(room.y-layout.commonRoom.y || 1) * layout.commonRoom.h/2;
    scene.graphics.fillStyle(0xede7cf, 1);
    scene.graphics.fillRoundedRect(
      doorX-(doorW/2), doorY-(doorH/2), doorW, doorH, 13
    );

    // If you want an arch or more rounded door, you can draw a portion of an ellipse/circle

    // --- AGENT SPRITE/ICON ---
    // Where in room? Fixed offset from center
    let avatarX = Phaser.Math.Clamp(
      room.x+(layout.commonRoom.x-room.x)*0.7,    // closer to own side/corner
      room.x-room.w/2+50, room.x+room.w/2-56
    );
    let avatarY = Phaser.Math.Clamp(
      room.y+(layout.commonRoom.y-room.y)*0.7,
      room.y-room.h/2+64, room.y+room.h/2-60
    );

    // If they're moving, interpolate pos; else fixed
    let agX = ag.x, agY = ag.y;
    // If (x,y) is in own room, render there, else if (in common), use common; else fallback to "walking"
    const epsilon = 17;
    let inCommon = Math.abs(ag.x-layout.commonRoom.x)<layout.commonRoom.w/2-epsilon
                && Math.abs(ag.y-layout.commonRoom.y)<layout.commonRoom.h/2-epsilon;
    let inHome =
      Math.abs(ag.x-room.x)<room.w/2-epsilon && Math.abs(ag.y-room.y)<room.h/2-epsilon;
    // If out of bounds (wrong room) snap to path
    if (!inCommon && !inHome) {
      agX = ag.x; agY = ag.y;
    } else if (inHome) {
      agX = avatarX; agY = avatarY;
    } else if (inCommon) {
      agX = layout.commonRoom.x + ((i===0)?-layout.commonRoom.w/4 : layout.commonRoom.w/4), agY = layout.commonRoom.y+layout.commonRoom.h/6+(i%2 ? 22 : -22);
    }

    // Draw agent avatar
    if(!agentSprites[id]) { // make sprite if not exists
      agentSprites[id] = scene.add.image(agX, agY, id).setDisplaySize(74,74).setDepth(5);
      agentSprites[id].taskText = scene.add.text(agX, agY+48, "", {fontFamily:"monospace",fontSize:'1.8vw',fill:"#e842b8"}).setOrigin(0.5,0.5).setDepth(6);
      agentSprites[id].nameText = scene.add.text(agX, agY-46, ag.name, {fontFamily:"monospace",fontSize:'1.2vw',fill:"#40914a",stroke:'#fff',strokeThickness:3}).setOrigin(0.5);
      agentSprites[id].bubble = null;
    }
    agentSprites[id].setPosition(agX, agY);
    agentSprites[id].nameText.setPosition(agX, agY-46);
    agentSprites[id].taskText.setText(TASK_ICONS[ag.task]||TASK_ICONS["?"]);
    agentSprites[id].taskText.setPosition(agX, agY+48);

    // Chat bubble (draw as dom text for now)
    if(agentSprites[id].bubble) agentSprites[id].bubble.destroy();
    if(ag.lastMessage && ag.lastMessage.length>0) {
      agentSprites[id].bubble = scene.add.text(agX, agY-68, ag.lastMessage,
        {fontFamily:"monospace",fontSize:'1.07vw',backgroundColor:"#fff9e7",color:"#444",padding:{x:9,y:7}})
        .setOrigin(0.5,1).setDepth(100).setShadow(2,2,"#ddc",3,true,true);
    }
    i++;
  }
}

// -- SOCKET.IO
const socket = io();
socket.emit("joinRoom", { roomId: "room1" });
socket.on("agentMessage", ({ from, payload, gameState: state }) => {
  gameState = state; // x,y is updated by backend, tasks etc if set
});

window.onload = () => new Phaser.Game(config);
</script>
</body>
</html>
